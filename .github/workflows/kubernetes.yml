name: Kubernetes Demo

on:
  workflow_dispatch:

jobs:
  deploy-to-minikube:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Start Minikube
        run: minikube start --driver=docker

      - name: Deploy Flask app
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/flask-deployment --timeout=180s
          kubectl get pods -l app=flask-web
          kubectl get service flask-service

      - name: Test Flask service
        run: |
          kubectl port-forward service/flask-service 8080:80 > /tmp/flask-forward.log 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true' EXIT

          if ! curl --fail --retry 10 --retry-all-errors --retry-delay 1 --max-time 5 http://127.0.0.1:8080/; then
            cat /tmp/flask-forward.log
            kubectl logs deployment/flask-deployment --tail=50
            exit 1
          fi
                - name: Test Kubernetes self-healing
        run: |
          echo "Pods before deletion"
          kubectl get pods -l app=flask-web

          pod_to_delete=$(kubectl get pods -l app=flask-web -o jsonpath='{.items[0].metadata.name}')
          echo "Deleting pod $pod_to_delete"
          kubectl delete pod "$pod_to_delete" --timeout=90s

          for attempt in {1..30}; do
            pod_count=$(kubectl get pods -l app=flask-web -o name | wc -l)
            if [ "$pod_count" -eq 2 ]; then
              break
            fi
            sleep 2
          done

          test "$pod_count" -eq 2
          kubectl wait --for=condition=Ready pods -l app=flask-web --timeout=120s

          echo "Pods after recovery"
          kubectl get pods -l app=flask-web