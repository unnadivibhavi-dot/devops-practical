name: CI Pipeline

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Build Docker image
        run: docker build -t flask-app:v1 .

      - name: Test Docker container
        run: |
          docker run -d --name flask-test -p 127.0.0.1:5000:5000 flask-app:v1
          if ! curl --fail --retry 10 --retry-all-errors --retry-delay 1 --max-time 5 http://127.0.0.1:5000/; then
            docker logs flask-test
            exit 1
          fi

      - name: Publish image to Docker Hub
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          docker tag flask-app:v1 "$DOCKERHUB_USERNAME/flask-app:v1"
          docker push "$DOCKERHUB_USERNAME/flask-app:v1"